name: fetch-market

on:
  schedule:
    # 毎日 6:15 JST（21:15 UTC）。米国市場の確定値が出た後、日経モーニング10（7:12 JST）の前。
    - cron: "15 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch market indicators
        run: python scripts/fetch_market.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "market data $(TZ=Asia/Tokyo date +%F)"
          git push
